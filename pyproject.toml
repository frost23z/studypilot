[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.13.8,<0.14" ]

[project]
name = "studypilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [ { name = "frost23z", email = "80541095+frost23z@users.noreply.github.com" } ]
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "langchain-chroma>=1.1",
  "langchain-google-genai>=4.5",
  "langchain-opendataloader-pdf>=2",
  "langchain-text-splitters>=1.1.3",
  "langgraph>=1.2.22",
  "langgraph-cli[inmem]>=0.4.43",
  "pydantic>=2.14.3",
  "pydantic-settings>=2.16.2",
  "sqlalchemy>=2.1.8",
]
scripts.studypilot = "studypilot:main"

[dependency-groups]
dev = [
  "pyrefly>=1.4.1",
  "pytest>=9.2",
]

[tool.ruff]
line-length = 100
lint.select = [
  "ASYNC", # Async-related checks
  "B",     # Bugbear
  "C4",    # Comprehension improvements
  "DTZ",   # Datetime timezone awareness
  "E",     # pycodestyle errors
  "F",     # Pyflakes
  "FAST",  # FastAPI-specific checks
  "G",     # Logging format
  "I",     # Import sorting
  "LOG",   # Logging best practices
  "PERF",  # Performance
  "PIE",   # Miscellaneous improvements
  "PT",    # pytest best practices
  "PTH",   # pathlib
  "RUF",   # Ruff-specific rules
  "S",     # Bandit security checks
  "SIM",   # Simplification
  "T20",   # Prevent accidental print statements
  "TRY",   # Exception handling
  "UP",    # Python modernization
]

[tool.ruff.lint.per-file-ignores]
"chat.py" = [ "T201" ]
"ingest.py" = [ "T201", "TRY301" ]
"src/studypilot/__init__.py" = [ "T201" ]
"tests/**/*.py" = [ "S101", "S105", "S106" ]

[tool.pyrefly]
project-includes = [
  "**/*.py*",
  "**/*.pyi",
]

[tool.pytest]
addopts = [ "-m", "not slow" ]
markers = [ "slow: mark a test as slow." ]
pythonpath = [ "." ]
